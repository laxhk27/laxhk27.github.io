    return new TextDecoder().decode(plain);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var form = document.getElementById('gate'), btn = document.getElementById('go'), err = document.getElementById('err');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var pass = document.getElementById('pass').value;
    btn.disabled = true; err.textContent = 'Unlocking… 解鎖中…';
    try {
      var html = await unlock(pass);
      try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, pass); } catch (x) {}
      show(html);
    } catch (x) {
      btn.disabled = false; err.textContent = 'Wrong passcode. Please try again. 密碼錯誤，請再試一次。';
    }
  });
  (async function () {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (x) {}
    if (!saved) return;
    try { show(await unlock(saved)); } catch (x) { try { localStorage.removeItem(KEY); } catch (y) {} }
  })();
</script>
</body>
