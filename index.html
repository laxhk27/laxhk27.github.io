<style>
  :root { --paper: #F5F7F6; --card: #FFFFFF; --ink: #17232B; --muted: #5A6A70; --line: #D9E1E0; --jade: #0E6B5E; --red: #C4302A; }

  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;

  p { margin: 0; color: var(--muted); font-size: .92rem; }
  label { font-size: .85rem; font-weight: 600; }
  input[type=password] { width: 100%; font: 600 1.1rem ui-monospace, Menlo, monospace; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }

  button { border: 0; border-radius: 10px; padding: 12px; font: 700 1rem inherit; background: var(--jade); color: #fff; cursor: pointer; }

  .err { color: var(--red); font-size: .88rem; min-height: 1.3em; }
</style>
