  var KEY = 'laxhk27-pass';
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function unlock(pass) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
    return new TextDecoder().decode(plain);
  }

  var form = document.getElementById('gate'), btn = document.getElementById('go'), err = document.getElementById('err');

    var pass = document.getElementById('pass').value;

      var html = await unlock(pass);
      try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, pass); } catch (x) {}
